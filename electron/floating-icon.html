<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: transparent;
            overflow: hidden;
            user-select: none;
        }

        body {
            -webkit-app-region: drag;
        }

        .floating-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #064e3b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            -webkit-app-region: no-drag;
            position: relative;
            overflow: hidden;
        }

        .floating-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .floating-icon:active {
            transform: scale(0.95);
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }

        .close-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .close-btn:hover {
            background: #ef4444;
        }

        .floating-icon:hover .close-btn {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="floating-icon" id="floatingIcon">
        <div class="close-btn" id="closeIcon">✕</div>
        <img src="../public/zedx-logo.png" alt="ZEDX AI" class="logo-img">
    </div>

    <script>
        const icon = document.getElementById('floatingIcon');
        const closeBtn = document.getElementById('closeIcon');

        // Prevent dragging when clicking the close button
        closeBtn.addEventListener('mousedown', (e) => {
            e.stopPropagation();
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Don't trigger toggleApp
            if (window.electronAPI) {
                window.electronAPI.hideIcon();
            }
        });

        icon.addEventListener('click', () => {
            if (window.electronAPI) {
                window.electronAPI.toggleApp();
            }
        });
    </script>
</body>

</html>
